title: OpenCode Usage Dashboard
description: >-
  A local, read-only dashboard for exploring OpenCode token and cost usage.

# GitHub Pages runs the legacy Jekyll builder for this repository, which only
# ships a fixed set of built-in themes. remote_theme is the supported way to
# use any other theme there, and is the installation method just-the-docs
# documents for GitHub Pages.
remote_theme: just-the-docs/just-the-docs@v0.12.0

# Rewrites relative links between Markdown files so the same links work both
# in the GitHub file view and on the published site.
plugins:
  - jekyll-relative-links
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache

relative_links:
  enabled: true
  collections: false

# Jekyll only applies a layout to files that have YAML front matter, so each
# published page carries its own front matter. index.md includes README.md so
# the README itself stays free of front matter in the GitHub file view.
defaults:
  - scope:
      path: ""
    values:
      layout: default

url: https://martinctc.github.io
baseurl: /opencode-dashboard

search_enabled: true
search:
  heading_level: 3
  previews: 2

# Turns each heading into a link target, which is what the in-page table of
# contents on the longer guides relies on.
heading_anchors: true

color_scheme: light
enable_copy_code_button: true

# Restrict the in-page table of contents to section headings, so it does not
# repeat the page title.
kramdown:
  toc_levels: 2..3

aux_links:
  View on GitHub:
    - https://github.com/martinctc/opencode-dashboard
aux_links_new_tab: true

back_to_top: true
back_to_top_text: Back to top

# This site is documentation only. It never publishes a generated dashboard,
# because those embed the source rows - project names, models and dates - and
# a dashboard built from real exports must not be published by accident. A
# dashboard built from tools/make_sample_data.py contains no real usage data
# and is safe to share locally, but it is gitignored so it never reaches this
# site either.
#
# The patterns below match the generated filenames from .gitignore. Do not use
# a bare "*.html" pattern here: Jekyll applies exclude rules when reading theme
# layouts as well, so "*.html" silently filters out the theme's own
# _layouts/default.html and every page renders unstyled.
#
# docs/ is deliberately NOT excluded. Its Markdown is published and its images
# are the screenshots the README embeds.
exclude:
  - "*.py"
  - tests/
  - tools/
  - requirements.txt
  - requirements-dev.txt
  - "*.csv"
  - usage_dashboard*.html
  - sample_dashboard*.html
  - out_test.html
  # index.md pulls the README in with include_relative, which reads it from the
  # source tree and ignores this rule. Excluding it just stops the site
  # publishing a raw markdown copy alongside the rendered home page.
  - README.md