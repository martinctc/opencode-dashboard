name: Deploy documentation site to GitHub Pages

# GitHub Pages' legacy builder reports a failed build only as a 404, with the
# error shown in the repository settings and nowhere queryable. Building through
# Actions instead surfaces the failure as a normal, readable job log.
#
# To use this, set Settings -> Pages -> Source to "GitHub Actions".
on:
  push:
    branches: ["main"]
    paths:
      - "**.md"
      - "_config.yml"
      - ".github/workflows/pages.yml"
      - "docs/**"
      - "dashboard.py"
      - "tools/make_sample_data.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # The sample dashboard is built from synthetic data (tools/make_sample_data.py).
      # jekyll-build-pages runs in a container and leaves _site owned by root, so the
      # runner user cannot write into it. Copy the built site into a writable staging
      # directory, add the sample there, and publish that instead. Real exports are
      # never involved.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate the synthetic sample dashboard
        run: |
          mkdir -p site
          cp -R _site/. site/
          python tools/make_sample_data.py --out "$RUNNER_TEMP/sample_usage.csv"
          # The sample is a layout showcase, not a real export, so suppress the
          # stale-data banner that would otherwise fire on its fixed dates.
          python dashboard.py --in "$RUNNER_TEMP/sample_usage.csv" --out site/sample_dashboard.html --stale-after-days 0

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
