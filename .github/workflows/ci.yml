name: Tests

# The unit tests only assert on strings in the emitted HTML, which cannot catch
# a chart that renders blank or a stylesheet that overflows on a narrow screen.
# The browser job therefore installs Chromium and runs the full suite rather
# than the bare one, so a rendering regression fails the build the same way a
# syntax error does.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README promises 3.9 or later, so the floor is tested alongside the
        # current stable release rather than assumed.
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the browser suite is actually exercised on locally.
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest tests -q
