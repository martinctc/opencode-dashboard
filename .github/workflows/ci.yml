name: Tests

# The unit tests only assert on strings in the emitted HTML, which cannot catch
# a chart that renders blank or a stylesheet that overflows on a narrow screen.
# The browser job therefore installs Chromium and runs the full suite rather
# than the bare one, so a rendering regression fails the build the same way a
# syntax error does.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  unit:
    # Pinned to 24.04 because ubuntu-latest is now 26.04, which no longer
    # provides a Python 3.9 build, and the matrix below tests the 3.9 floor the
    # README promises. Revisit when 3.9 is dropped or a 26.04 build appears.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # README promises 3.9 or later, so the floor is tested alongside the
        # current stable release rather than assumed.
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The version the browser suite is actually exercised on locally.
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check JS/CSS formatting
        run: npx --yes prettier@3 --check static/dashboard.js static/dashboard.css
