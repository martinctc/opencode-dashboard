name: Feature request
description: Suggest an enhancement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem you are
        trying to solve, not just the solution you have in mind. Check
        docs/parity.md first — some gaps with the upstream tool are already
        tracked there.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that the dashboard makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? A sketch of the UI or CLI is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, screenshots, links to related issues, etc.
